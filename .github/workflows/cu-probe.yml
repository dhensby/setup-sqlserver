name: CU page probe

on:
  push:
    branches:
      - experiment/cu-proxy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install undici
        run: npm install --no-save --ignore-scripts --no-audit --no-fund undici@7
      - name: Probe the cumulative update pages
        uses: ./.github/actions/cu-probe
